<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2937">Deadlock — circular wait</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">Two threads each hold one lock and wait for the other's. Neither can proceed.</text>

  <!-- Thread A -->
  <rect x="80" y="120" width="190" height="72" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="175" y="150" font-size="14" font-weight="700" fill="#1b5e20" text-anchor="middle">Thread A</text>
  <text x="175" y="172" font-size="11" fill="#33691e" text-anchor="middle">holds Lock1</text>

  <!-- Thread B -->
  <rect x="650" y="120" width="190" height="72" rx="8" fill="#bbdefb" stroke="#1a73e8"/>
  <text x="745" y="150" font-size="14" font-weight="700" fill="#0d47a1" text-anchor="middle">Thread B</text>
  <text x="745" y="172" font-size="11" fill="#1565c0" text-anchor="middle">holds Lock2</text>

  <!-- Locks -->
  <rect x="330" y="300" width="140" height="64" rx="8" fill="#ffe0b2" stroke="#f57c00"/>
  <text x="400" y="326" font-size="14" font-weight="700" fill="#e65100" text-anchor="middle">Lock1</text>
  <text x="400" y="346" font-size="11" fill="#ef6c00" text-anchor="middle">held by A</text>

  <rect x="450" y="300" width="140" height="64" rx="8" fill="#ffe0b2" stroke="#f57c00"/>
  <text x="520" y="326" font-size="14" font-weight="700" fill="#e65100" text-anchor="middle">Lock2</text>
  <text x="520" y="346" font-size="11" fill="#ef6c00" text-anchor="middle">held by B</text>

  <!-- holds (solid) -->
  <line x1="150" y1="192" x2="375" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="248" font-size="12" font-weight="700" fill="#2e7d32">holds</text>

  <line x1="770" y1="192" x2="545" y2="300" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="248" font-size="12" font-weight="700" fill="#1a73e8">holds</text>

  <!-- waits for (red dashed, crossing = the cycle) -->
  <line x1="205" y1="192" x2="505" y2="300" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="360" y="288" font-size="12" font-weight="700" fill="#d32f2f">waits for</text>

  <line x1="715" y1="192" x2="415" y2="300" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="520" y="232" font-size="12" font-weight="700" fill="#d32f2f">waits for</text>

  <!-- deadlock badge at the crossing -->
  <rect x="410" y="248" width="100" height="24" rx="12" fill="#d32f2f"/>
  <text x="460" y="264" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DEADLOCK</text>

  <!-- takeaway -->
  <rect x="40" y="392" width="840" height="56" rx="8" fill="#f9fafb" stroke="#6b7280"/>
  <text x="460" y="418" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Break one condition:</text>
  <text x="460" y="440" font-size="12" fill="#374151" text-anchor="middle">impose a global lock order (always A then B), or use tryLock + timeout and back off.</text>
</svg>

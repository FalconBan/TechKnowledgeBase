<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2937">ZGC — Colored Pointers + Load Barriers</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">Color/mark metadata lives in spare high address bits of a 64-bit reference — no side table.</text>

  <!-- COLORED POINTER section -->
  <text x="40" y="108" font-size="13" font-weight="700" fill="#374151">COLORED POINTER (one 64-bit reference)</text>

  <!-- pointer bar: y=120, h=70; segments sum to 840 (x 40..880) -->
  <g>
    <rect x="40"  y="120" width="120" height="70" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="100" y="150" font-size="14" font-weight="600" fill="#1b5e20" text-anchor="middle">Mark0</text>
    <text x="100" y="172" font-size="11" fill="#33691e" text-anchor="middle">mark bit A</text>

    <rect x="160" y="120" width="120" height="70" fill="#bbdefb" stroke="#1a73e8"/>
    <text x="220" y="150" font-size="14" font-weight="600" fill="#0d47a1" text-anchor="middle">Mark1</text>
    <text x="220" y="172" font-size="11" fill="#1565c0" text-anchor="middle">mark bit B</text>

    <rect x="280" y="120" width="160" height="70" fill="#ffe0b2" stroke="#f57c00"/>
    <text x="360" y="150" font-size="14" font-weight="600" fill="#e65100" text-anchor="middle">Finalizable</text>
    <text x="360" y="172" font-size="11" fill="#ef6c00" text-anchor="middle">needs finalization</text>

    <rect x="440" y="120" width="440" height="70" fill="#eeeeee" stroke="#9e9e9e"/>
    <text x="660" y="150" font-size="14" font-weight="600" fill="#424242" text-anchor="middle">virtual address</text>
    <text x="660" y="172" font-size="11" fill="#757575" text-anchor="middle">the actual object location (low bits)</text>
  </g>

  <!-- note under pointer -->
  <text x="40" y="216" font-size="12" fill="#6b7280">High address bits the CPU never uses hold GC state. A reference is "colored" by which mark bits are set.</text>

  <!-- divider -->
  <line x1="40" y1="252" x2="880" y2="252" stroke="#e5e7eb"/>
  <text x="40" y="286" font-size="13" font-weight="700" fill="#374151">LOAD BARRIER (runs on every reference read)</text>

  <!-- flow -->
  <!-- load ref box: x=40,y=340,w=150,h=64 center y=372 -->
  <rect x="40" y="340" width="150" height="64" rx="8" fill="#f9fafb" stroke="#6b7280"/>
  <text x="115" y="368" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">load ref</text>
  <text x="115" y="388" font-size="11" fill="#6b7280" text-anchor="middle">(read a field)</text>

  <!-- arrow load ref -> diamond -->
  <line x1="190" y1="372" x2="238" y2="372" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision diamond center (340,372) -->
  <polygon points="240,372 340,312 440,372 340,432" fill="#fff7ef" stroke="#f57c00"/>
  <text x="340" y="368" font-size="12.5" font-weight="600" fill="#e65100" text-anchor="middle">color bits</text>
  <text x="340" y="386" font-size="12.5" font-weight="600" fill="#e65100" text-anchor="middle">current?</text>

  <!-- yes branch: diamond right (440,372) -> box -->
  <line x1="440" y1="372" x2="558" y2="372" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="362" font-size="12" font-weight="700" fill="#2e7d32" text-anchor="middle">yes</text>
  <rect x="560" y="340" width="200" height="64" rx="8" fill="#f0f9f1" stroke="#2e7d32"/>
  <text x="660" y="368" font-size="13" font-weight="600" fill="#1b5e20" text-anchor="middle">use directly</text>
  <text x="660" y="388" font-size="11" fill="#33691e" text-anchor="middle">fast path, no work</text>

  <!-- no branch: diamond bottom (340,432) -> down -> right -> box -->
  <polyline points="340,432 340,502 558,502" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="470" font-size="12" font-weight="700" fill="#e65100">no</text>
  <rect x="560" y="470" width="320" height="64" rx="8" fill="#fff7ef" stroke="#f57c00"/>
  <text x="720" y="498" font-size="13" font-weight="600" fill="#e65100" text-anchor="middle">follow forwarding table,</text>
  <text x="720" y="518" font-size="13" font-weight="600" fill="#e65100" text-anchor="middle">fix pointer in place</text>

  <!-- bottom note -->
  <text x="40" y="580" font-size="12" fill="#6b7280">Because relocation is concurrent, readers never see a torn state — pause stays single-digit ms regardless of heap size.</text>
</svg>

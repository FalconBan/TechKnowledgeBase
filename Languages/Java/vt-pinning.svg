<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2937">Virtual Threads — M:N mapping &amp; the pinning trap</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">Many virtual threads share a few carrier (platform) threads. A blocking call normally unmounts the VT and frees its carrier.</text>

  <!-- ============ LEFT: NORMAL ============ -->
  <text x="40" y="108" font-size="13" font-weight="700" fill="#2e7d32">NORMAL — I/O unmounts the VT</text>

  <!-- carrier bar -->
  <rect x="40" y="150" width="360" height="54" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="220" y="177" font-size="14" font-weight="700" fill="#1b5e20" text-anchor="middle">Carrier #1</text>
  <text x="220" y="196" font-size="11" fill="#33691e" text-anchor="middle">(platform / OS thread)</text>

  <!-- VT-B running (attached) -->
  <line x1="220" y1="204" x2="220" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="145" y="250" width="150" height="64" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="220" y="278" font-size="13" font-weight="600" fill="#1b5e20" text-anchor="middle">VT-B — running</text>
  <text x="220" y="298" font-size="11" fill="#33691e" text-anchor="middle">(carrier is free)</text>

  <!-- VT-A unmounted (detached, dashed) -->
  <line x1="360" y1="204" x2="375" y2="250" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="392" y="230" font-size="11" fill="#2e7d32">I/O wait</text>
  <rect x="300" y="250" width="150" height="64" rx="8" fill="#f0f9f1" stroke="#2e7d32"/>
  <text x="375" y="278" font-size="13" font-weight="600" fill="#1b5e20" text-anchor="middle">VT-A — blocked</text>
  <text x="375" y="298" font-size="11" fill="#33691e" text-anchor="middle">on I/O (unmounted)</text>

  <text x="40" y="352" font-size="12" fill="#6b7280">Unmounting frees the carrier — other VTs keep running.</text>

  <!-- ============ RIGHT: PINNED ============ -->
  <text x="480" y="108" font-size="13" font-weight="700" fill="#f57c00">PINNED — synchronized blocks the carrier</text>

  <!-- carrier bar (stuck) -->
  <rect x="480" y="150" width="360" height="54" rx="8" fill="#ffe0b2" stroke="#f57c00"/>
  <text x="660" y="177" font-size="14" font-weight="700" fill="#e65100" text-anchor="middle">Carrier #1</text>
  <text x="660" y="196" font-size="11" fill="#ef6c00" text-anchor="middle">(stuck with VT-A)</text>

  <!-- VT-A pinned (attached, red) -->
  <line x1="585" y1="204" x2="585" y2="250" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="230" font-size="11" fill="#d32f2f">holds monitor</text>
  <rect x="510" y="250" width="150" height="64" rx="8" fill="#ffcdd2" stroke="#d32f2f"/>
  <text x="585" y="278" font-size="13" font-weight="700" fill="#b71c1c" text-anchor="middle">VT-A — PINNED</text>
  <text x="585" y="298" font-size="11" fill="#b71c1c" text-anchor="middle">inside synchronized</text>

  <!-- stalled VTs (can't run) -->
  <line x1="765" y1="204" x2="765" y2="235" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="690" y="235" width="150" height="44" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="765" y="262" font-size="12" font-weight="600" fill="#424242" text-anchor="middle">VT-B — stalled</text>
  <rect x="690" y="285" width="150" height="44" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="765" y="312" font-size="12" font-weight="600" fill="#424242" text-anchor="middle">VT-C — stalled</text>

  <text x="480" y="352" font-size="12" fill="#6b7280">Pinned VT can't unmount — the carrier is stuck, so every other VT on it waits.</text>

  <!-- divider -->
  <line x1="40" y1="392" x2="880" y2="392" stroke="#e5e7eb"/>

  <!-- takeaway -->
  <rect x="40" y="410" width="840" height="64" rx="8" fill="#f9fafb" stroke="#6b7280"/>
  <text x="460" y="436" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Rule:</text>
  <text x="460" y="458" font-size="12" fill="#374151" text-anchor="middle">On virtual threads use ReentrantLock (unmountable), not synchronized (pins). Pinning silently kills M:N scalability.</text>
</svg>
